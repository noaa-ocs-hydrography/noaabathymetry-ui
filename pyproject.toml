[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "noaabathymetry-ui"
version = "0.3.0"
requires-python = ">=3.10"
description = "Browser-based interface for noaabathymetry"
dependencies = [
    "noaabathymetry==0.8.3",
    "boto3==1.42.52",
    "botocore==1.42.52",
    "urllib3==2.6.3",
    "aiohttp==3.13.5",
    "certifi==2026.2.25",
]

[project.scripts]
noaabathymetry-ui = "src.main:main"
